name: Validate H ∈ M

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("src/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          Path("/tmp/hm-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/hm-inline.js
          node --check src/sw.js
      - name: Run smoke tests
        run: npm test
